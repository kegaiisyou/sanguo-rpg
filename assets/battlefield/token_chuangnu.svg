      <path d="M128 148 L128 256" stroke="#5c5346" stroke-width="1.6" opacity=".8"/>
<path d="M98 72 L98 54 Q128 40 158 54 L158 72 Z" fill="#3e382f" stroke="#2b2620" stroke-width="2.4"/>
      <path d="M98 68 Q128 60 158 68" fill="none" stroke="#8a7a5c" stroke-width="2"/>
      <path d="M128 44 L128 28 M120 32 L128 24 L136 32" fill="none" stroke="#2b2620" stroke-width="2.2"/>
</g>
