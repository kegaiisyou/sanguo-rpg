<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hematoma" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#5a0d12"/>
      <stop offset="45%" stop-color="#7d1320"/>
      <stop offset="75%" stop-color="#a8324a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8324a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="knuckle" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#c76b78" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8e1f2b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a0d12" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <!-- 掌根大块淤青 -->
    <ellipse cx="58" cy="74" rx="30" ry="22" fill="url(#hematoma)"/>
    <!-- 四指节压痕 -->
    <circle cx="38" cy="46" r="13" fill="url(#knuckle)"/>
    <circle cx="53" cy="42" r="13" fill="url(#knuckle)"/>
    <circle cx="68" cy="44" r="13" fill="url(#knuckle)"/>
    <circle cx="82" cy="50" r="12" fill="url(#knuckle)"/>
    <!-- 拇指压痕 -->
    <circle cx="34" cy="64" r="11" fill="url(#knuckle)"/>
  </g>
</svg>
