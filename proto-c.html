<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型C · 极简几何 + 速度线</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#e8e8e8;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:30px;
    font-weight:700;font-size:14px;letter-spacing:2px;pointer-events:none;text-shadow:0 1px 4px #000}
  .ally{color:#5fb0ff}.enemy{color:#ff6b6b}
  .bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  button{background:#15171c;color:#cfe3ff;border:1px solid #34507a;padding:10px 22px;border-radius:8px;font-size:15px;cursor:pointer}
  button:hover{background:#1f2330}
  button:disabled{opacity:.5;cursor:default}
  .tip{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);color:#8893a3;font-size:13px;text-align:center}
  .nav{position:absolute;bottom:26px;right:22px;font-size:12px;color:#55606e}
  .nav a{color:#7fa8d8;text-decoration:none;margin-left:8px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="ally">我方军势</div><div class="enemy">敌方军势</div></div>
  <div class="tip">原型C：极简几何（三角=兵 / 圆=将 / 线=冲锋）+ 镜头震动 + 速度线 + 墨溅（零素材）</div>
  <div class="bar"><button id="go">▶ 开始演示</button></div>
  <div class="nav">对比：<a href="proto-ab.html">A+B 组合</a><a href="proto-a.html">A 兵海演出</a><a href="proto-b.html">B 文字战报</a><a href="proto-index.html">首页</a></div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const go=document.getElementById('go');
const N_PER=120;
let units=[],phase='idle',t=0,last=0,running=false,shake=0,slashes=[],ink=[];
function tri(x,y,dir,col,s){ctx.save();ctx.translate(x,y);ctx.rotate(dir);ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s*0.7,s*0.7);ctx.lineTo(-s*0.7,-s*0.7);ctx.closePath();ctx.fill();ctx.restore();}
function makeUnits(){units=[];const cols=16,rows=10;
  for(let i=0;i<N_PER;i++){const c=i%cols,r=(i/cols|0);
    units.push({side:'ally',x:60+c*((W*0.30)/cols),y:H*0.22+r*((H*0.56)/rows),alive:true});
    units.push({side:'enemy',x:W-60-c*((W*0.30)/cols),y:H*0.22+r*((H*0.56)/rows),alive:true});}}
function start(){if(running)return;makeUnits();phase='charge';t=0;running=true;last=performance.now();go.disabled=true;slashes=[];ink=[];requestAnimationFrame(loop);}
function step(dt){const cx=W/2;
  for(const u of units){if(!u.alive)continue;
    if(phase==='charge'){const dir=u.side==='ally'?1:-1;u.x+=dir*Math.min(170*dt,Math.abs(cx-u.x)-10);}
    else if(phase==='clash'){u.x+=(Math.random()-0.5)*40*dt;u.y+=(Math.random()-0.5)*40*dt;
      if(Math.random()<0.9*dt){if(u.alive&&Math.random()<(u.side==='ally'?.4:.8)){u.alive=false;
        ink.push({x:u.x,y:u.y,r:2,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,life:1});}}
      if(Math.random()<0.04)shake=8;}
    else if(phase==='route'){if(u.side==='enemy'){const out=u.x<cx?-1:1;u.x+=out*(110+Math.random()*70)*dt;u.y+=(Math.random()-.5)*150*dt;}else u.x+=70*dt;}
    u.x=Math.max(-20,Math.min(W+20,u.x));u.y=Math.max(8,Math.min(H-8,u.y));}
  if(phase==='duel'){slashes.push({x1:W*0.40,y1:H*0.5,x2:W*0.62,y2:H*0.5,life:1});}
  shake*=0.86;
  for(const s of slashes)s.life-=dt*2.2;
  for(const p of ink){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.6;}
  slashes=slashes.filter(s=>s.life>0);ink=ink.filter(p=>p.life>0);}
function draw(){ctx.clearRect(0,0,W,H);
  ctx.save();if(shake>0.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // 速度线
  if(phase==='charge'||phase==='route'){ctx.strokeStyle='rgba(200,220,255,.10)';ctx.lineWidth=1;
    for(let i=0;i<14;i++){const y=20+Math.random()*(H-40);const len=40+Math.random()*120;const x=Math.random()*W;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len,y);ctx.stroke();}}
  for(const u of units){if(!u.alive)continue;const dir=u.side==='ally'?0:Math.PI;
    tri(u.x,u.y,dir,u.side==='ally'?'#5fb0ff':'#ff6b6b',5);}
  // 主将圆
  function gen(x,y,col,a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,H*0.5,12,0,7);ctx.stroke();
    ctx.fillStyle=col;ctx.fillRect(x-1.5,H*0.5-30,3,18);ctx.beginPath();ctx.moveTo(x,H*0.5-30);ctx.lineTo(x+13,H*0.5-25);ctx.lineTo(x,H*0.5-20);ctx.fill();ctx.restore();}
  if(phase!=='duel'&&phase!=='route'){gen(W*0.40,'#ffd24a',1);gen(W*0.60,'#ff8a5c',1);}
  else if(phase==='duel'){gen(W*0.40,'#ffd24a',1);gen(W*0.60,'#ff8a5c',0.15);}
  else gen(W*0.52,'#ffd24a',1);
  // 墨溅
  for(const p of ink){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#c0392b';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r+(1-p.life)*6,0,7);ctx.fill();ctx.restore();}
  // 一闪
  for(const s of slashes){ctx.save();ctx.globalAlpha=s.life;ctx.strokeStyle='#fff';ctx.lineWidth=3*s.life+1;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();ctx.restore();}
  ctx.restore();}
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  t+=dt;step(dt);draw();
  if(phase==='charge'&&t>1.5){phase='clash';t=0;}
  else if(phase==='clash'&&t>2.0){phase='duel';t=0;}
  else if(phase==='duel'&&t>0.7){phase='route';t=0;}
  else if(phase==='route'&&t>2.3){phase='done';running=false;go.disabled=false;}
  if(running)requestAnimationFrame(loop);}
go.addEventListener('click',start);
</script>
</body>
</html>
