<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水墨图标库预览</title>
<style>
body{margin:0;padding:20px;background:#2c2418;font-family:"STKaiti","KaiTi",serif;color:#e8d8b8;}
h1{text-align:center;letter-spacing:8px;font-weight:normal;margin:0 0 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;max-width:600px;margin:0 auto;}
.cell{background:rgba(255,245,220,.06);border:1px solid rgba(200,170,120,.2);border-radius:10px;padding:10px;text-align:center;}
.cell img{width:64px;height:64px;object-fit:contain;mix-blend-mode:screen;}
.cell .name{margin-top:6px;font-size:13px;color:#c8a878;letter-spacing:2px;}
</style>
</head>
<body>
<h1>水墨图标库 · 45 枚</h1>
<div class="grid" id="grid"></div>
<script>
var names = ['宅','仓','厨','军','宿','农','武','哨','帐','矿','药','丹','书','钱','剑','盾','弓','马','酒','食','衣','铁','木','石','晴','月','雨','阴','雪','心','话','息','工','采','袋','店','坊','衙','火','旗','人','箱','臼','卷','印'];
var g = document.getElementById('grid');
names.forEach(function(n){
  g.innerHTML += '<div class="cell"><img src="shared/img/icons/'+n+'.png"><div class="name">'+n+'</div></div>';
});
</script>
</body>
</html>
