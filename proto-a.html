<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型A · Canvas兵海 + 文字演出</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;color:#e8e8e8;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 26px;font-weight:700;font-size:14px;letter-spacing:1px;pointer-events:none;text-shadow:0 1px 4px #000}
  .ally{color:#5fb0ff}.enemy{color:#ff6b6b}
  .count{font-size:30px;font-variant-numeric:tabular-nums;margin-left:6px}
  .kill{position:absolute;top:58px;right:26px;color:#ffd24a;font-size:18px;font-weight:700;text-shadow:0 1px 4px #000}
  .stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) scale(0) rotate(-14deg);
    font-size:min(36vw,260px);font-weight:900;color:#e23b2e;font-family:"STKaiti","KaiTi","SimSun",serif;
    text-shadow:0 0 40px rgba(226,59,46,.8),0 0 12px rgba(255,180,120,.6);opacity:0;pointer-events:none}
  .stamp.show{animation:stamp .95s cubic-bezier(.2,1.5,.35,1) forwards}
  @keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-14deg)}
    16%{opacity:1}42%{transform:translate(-50%,-50%) scale(1) rotate(-14deg)}
    82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04) rotate(-14deg)}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.show{animation:fl .4s ease-out}
  @keyframes fl{0%{opacity:.92}100%{opacity:0}}
  .bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  button{background:#1b2330;color:#cfe3ff;border:1px solid #34507a;padding:10px 22px;border-radius:8px;font-size:15px;cursor:pointer}
  button:hover{background:#243247}
  button:disabled{opacity:.5;cursor:default}
  .tip{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);color:#9fb0c3;font-size:13px;text-align:center}
  .nav{position:absolute;bottom:26px;right:22px;font-size:12px;color:#6b7a8d}
  .nav a{color:#7fa8d8;text-decoration:none;margin-left:8px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="ally">我方兵力<span class="count" id="aN">0</span></div>
    <div class="enemy"><span class="count" id="eN">0</span>敌方兵力</div>
  </div>
  <div class="kill" id="kill">斩获 0</div>
  <div class="stamp" id="stamp">斬</div>
  <div class="flash" id="flash"></div>
  <div class="tip">原型A：Canvas 兵海两军对冲 + 无双式斩将文字印章（零美术素材）</div>
  <div class="bar"><button id="go">▶ 开始演示</button></div>
  <div class="nav">对比：<a href="proto-ab.html">A+B 组合</a><a href="proto-b.html">B 文字战报</a><a href="proto-c.html">C 几何速度线</a><a href="proto-index.html">首页</a></div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const stamp=document.getElementById('stamp'),flash=document.getElementById('flash');
const aN=document.getElementById('aN'),eN=document.getElementById('eN'),killEl=document.getElementById('kill');
const go=document.getElementById('go');
const N_PER=260;
let units=[],genA,genE,phase='idle',t=0,last=0,kills=0,running=false;
function makeUnits(){
  units=[];const cols=22,rows=12;
  for(let i=0;i<N_PER;i++){
    const c=i%cols,r=(i/cols|0);
    const ax=46+c*((W*0.40-46)/cols), ay=H*0.20+r*((H*0.60)/rows);
    const ex=W-46-c*((W*0.40-46)/cols), ey=H*0.20+r*((H*0.60)/rows);
    units.push({side:'ally',x:ax,y:ay,alive:true});
    units.push({side:'enemy',x:ex,y:ey,alive:true});
  }
  genA={x:W*0.40,y:H*0.50,alive:true};
  genE={x:W*0.60,y:H*0.50,alive:true};
}
function start(){
  if(running)return;
  makeUnits();phase='charge';t=0;kills=0;running=true;last=performance.now();go.disabled=true;
  requestAnimationFrame(loop);
}
function triggerDuel(){stamp.classList.remove('show');void stamp.offsetWidth;stamp.classList.add('show');
  flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');}
function step(dt){
  const cx=W/2;
  for(const u of units){
    if(!u.alive)continue;
    if(phase==='charge'){
      const dir=u.side==='ally'?1:-1;
      u.x+=dir*Math.min(150*dt,Math.abs(cx-u.x)-8);
    }else if(phase==='clash'){
      u.x+=(Math.random()-0.5)*36*dt;u.y+=(Math.random()-0.5)*36*dt;
      if(Math.random()<(u.side==='ally'?0.45:0.85)*dt){u.alive=false;if(u.side==='enemy')kills++;}
    }else if(phase==='route'){
      if(u.side==='enemy'){const out=u.x<cx?-1:1;u.x+=out*(95+Math.random()*70)*dt;u.y+=(Math.random()-0.5)*140*dt;}
      else u.x+=60*dt;
    }
    u.x=Math.max(-20,Math.min(W+20,u.x));u.y=Math.max(8,Math.min(H-8,u.y));
  }
  if(phase==='charge'){genA.x+=Math.min(120*dt,cx-genA.x-30);genE.x-=Math.min(120*dt,genE.x-cx-30);}
  else if(phase==='duel'){genA.x+=(cx-genA.x)*Math.min(1,6*dt);genE.alive=false;}
  else if(phase==='route'){genA.x+=(cx+W*0.12-genA.x)*Math.min(1,3*dt);}
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0e1116');g.addColorStop(.62,'#141a22');g.addColorStop(1,'#1c2530');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 中线微光
  const mg=ctx.createLinearGradient(W/2-60,0,W/2+60,0);
  mg.addColorStop(0,'rgba(95,176,255,0)');mg.addColorStop(.5,'rgba(180,200,230,.06)');mg.addColorStop(1,'rgba(255,107,107,0)');
  ctx.fillStyle=mg;ctx.fillRect(W/2-60,0,120,H);
  for(const u of units){if(!u.alive)continue;
    ctx.fillStyle=u.side==='ally'?'rgba(95,176,255,.85)':'rgba(255,107,107,.82)';
    ctx.fillRect(u.x-2,u.y-2,4,4);}
  // 主将
  function gen(o,col){if(!o.alive)return;ctx.save();ctx.translate(o.x,o.y);
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.stroke();
    ctx.fillStyle=col;ctx.fillRect(-1.5,-26,3,16);ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(12,-22);ctx.lineTo(0,-18);ctx.fill();
    ctx.restore();}
  gen(genA,'#ffd24a');gen(genE,'#ff8a5c');
}
function updateHud(){let a=0,e=0;for(const u of units){if(!u.alive)continue;u.side==='ally'?a++:e++;}
  aN.textContent=a;eN.textContent=e;killEl.textContent='斩获 '+kills;}
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(phase==='duel')dt*=0.28;
  t+=dt;step(dt);draw();updateHud();
  if(phase==='charge'&&t>1.6){phase='clash';t=0;}
  else if(phase==='clash'&&t>2.0){phase='duel';t=0;triggerDuel();}
  else if(phase==='duel'&&t>0.95){phase='route';t=0;}
  else if(phase==='route'&&t>2.4){phase='done';running=false;go.disabled=false;}
  if(running)requestAnimationFrame(loop);
}
go.addEventListener('click',start);
</script>
</body>
</html>
