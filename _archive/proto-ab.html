<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 A+B · Canvas兵海 + 文字战报</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e13;color:#e8e8e8;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  /* 电影暗角（来自 B） */
  #wrap::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 200px 60px rgba(0,0,0,.7)}
  .hud{position:absolute;top:14px;left:0;right:0;z-index:4;display:flex;justify-content:space-between;
    padding:0 26px;font-weight:700;font-size:14px;letter-spacing:1px;pointer-events:none;text-shadow:0 1px 4px #000}
  .ally{color:#5fb0ff}.enemy{color:#ff6b6b}
  .count{font-size:30px;font-variant-numeric:tabular-nums;margin-left:6px}
  .kill{position:absolute;top:58px;right:26px;z-index:4;color:#ffd24a;font-size:18px;font-weight:700;text-shadow:0 1px 4px #000}
  /* 底部字幕（来自 B） */
  #stage{position:absolute;left:0;right:0;bottom:104px;z-index:4;display:flex;flex-direction:column;
    align-items:center;gap:9px;pointer-events:none;padding:0 10vw}
  .line{font-size:21px;letter-spacing:2px;opacity:0;transform:translateY(12px);
    animation:rise .8s ease forwards;text-shadow:0 2px 10px #000;color:#d7dee7;text-align:center}
  .line .k{color:#ffd24a;font-weight:700}.line .r{color:#ff6b6b;font-weight:700}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .word{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(.4);z-index:6;
    font-size:min(28vw,200px);font-weight:900;font-family:"STKaiti","KaiTi",serif;opacity:0;color:#e23b2e;
    text-shadow:0 0 40px rgba(226,59,46,.85);animation:word 1.1s cubic-bezier(.2,1.5,.3,1) forwards;pointer-events:none}
  @keyframes word{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-8deg)}
    18%{opacity:1}60%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(-8deg)}}
  .stamp{position:absolute;top:46%;left:50%;z-index:6;transform:translate(-50%,-50%) scale(0) rotate(-14deg);
    font-size:min(36vw,260px);font-weight:900;color:#e23b2e;font-family:"STKaiti","KaiTi","SimSun",serif;
    text-shadow:0 0 40px rgba(226,59,46,.8),0 0 12px rgba(255,180,120,.6);opacity:0;pointer-events:none}
  .stamp.show{animation:stamp .95s cubic-bezier(.2,1.5,.35,1) forwards}
  @keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-14deg)}
    16%{opacity:1}42%{transform:translate(-50%,-50%) scale(1) rotate(-14deg)}
    82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04) rotate(-14deg)}}
  .flash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}
  .flash.show{animation:fl .4s ease-out}
  @keyframes fl{0%{opacity:.92}100%{opacity:0}}
  .bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  button{background:#1b2330;color:#cfe3ff;border:1px solid #34507a;padding:10px 22px;border-radius:8px;font-size:15px;cursor:pointer}
  button:hover{background:#243247}
  button:disabled{opacity:.5;cursor:default}
  .tip{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);color:#9fb0c3;font-size:13px;z-index:5}
  .nav{position:absolute;bottom:26px;right:22px;font-size:12px;color:#6b7a8d;z-index:5}
  .nav a{color:#7fa8d8;text-decoration:none;margin-left:8px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="ally">我方兵力<span class="count" id="aN">0</span></div>
    <div class="enemy"><span class="count" id="eN">0</span>敌方兵力</div>
  </div>
  <div class="kill" id="kill">斩获 0</div>
  <div id="stage"></div>
  <div class="stamp" id="stamp">斬</div>
  <div class="flash" id="flash"></div>
  <div class="tip">原型 A+B：Canvas 兵海战场（A）叠加电影式文字战报（B），斩将触发全屏印章</div>
  <div class="bar"><button id="go">▶ 开始演示</button></div>
  <div class="nav">对比：<a href="proto-ab.html">A+B 组合</a><a href="proto-a.html">A 兵海</a><a href="proto-b.html">B 战报</a><a href="proto-c.html">C 几何</a><a href="proto-index.html">首页</a></div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const stamp=document.getElementById('stamp'),flash=document.getElementById('flash');
const aN=document.getElementById('aN'),eN=document.getElementById('eN'),killEl=document.getElementById('kill');
const go=document.getElementById('go'),stage=document.getElementById('stage');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const N_PER=260;
let units=[],genA,genE,phase='idle',t=0,last=0,kills=0,running=false;
function makeUnits(){units=[];const cols=22,rows=12;
  for(let i=0;i<N_PER;i++){const c=i%cols,r=(i/cols|0);
    const ax=46+c*((W*0.40-46)/cols),ay=H*0.20+r*((H*0.60)/rows);
    const ex=W-46-c*((W*0.40-46)/cols),ey=H*0.20+r*((H*0.60)/rows);
    units.push({side:'ally',x:ax,y:ay,alive:true});units.push({side:'enemy',x:ex,y:ey,alive:true});}
  genA={x:W*0.40,y:H*0.50,alive:true};genE={x:W*0.60,y:H*0.50,alive:true};}
// ── 文字战报（B）──
function spawnLine(html){if(stage.children.length>4)stage.removeChild(stage.firstChild);
  const d=document.createElement('div');d.className='line';d.innerHTML=html;stage.appendChild(d);}
function spawnWord(html){const d=document.createElement('div');d.className='word';d.textContent=html;
  document.getElementById('wrap').appendChild(d);setTimeout(()=>d.remove(),1200);}
function spawnCount(prefix){if(stage.children.length>4)stage.removeChild(stage.firstChild);
  const d=document.createElement('div');d.className='line';d.innerHTML=prefix+' <span class="r" id="cnt">0</span> 级';stage.appendChild(d);
  const el=document.getElementById('cnt');let v=0;const target=12700;
  const iv=setInterval(()=>{v+=Math.ceil(target/45);if(v>=target){v=target;clearInterval(iv);}el.textContent=v.toLocaleString();},22);}
function triggerDuel(){stamp.classList.remove('show');void stamp.offsetWidth;stamp.classList.add('show');
  flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');}
function start(){if(running)return;stage.innerHTML='';makeUnits();phase='charge';t=0;kills=0;running=true;last=performance.now();go.disabled=true;
  spawnLine('<span class="k">建安五年</span> · 官渡夜');
  setTimeout(()=>spawnLine('曹公麾下精骑五千，衔枚夜进'),900);
  requestAnimationFrame(loop);}
function step(dt){const cx=W/2;
  for(const u of units){if(!u.alive)continue;
    if(phase==='charge'){const dir=u.side==='ally'?1:-1;u.x+=dir*Math.min(150*dt,Math.abs(cx-u.x)-8);}
    else if(phase==='clash'){u.x+=(Math.random()-0.5)*36*dt;u.y+=(Math.random()-0.5)*36*dt;
      if(Math.random()<(u.side==='ally'?0.45:0.85)*dt){u.alive=false;if(u.side==='enemy')kills++;}}
    else if(phase==='route'){if(u.side==='enemy'){const out=u.x<cx?-1:1;u.x+=out*(95+Math.random()*70)*dt;u.y+=(Math.random()-0.5)*140*dt;}else u.x+=60*dt;}
    u.x=Math.max(-20,Math.min(W+20,u.x));u.y=Math.max(8,Math.min(H-8,u.y));}
  if(phase==='charge'){genA.x+=Math.min(120*dt,cx-genA.x-30);genE.x-=Math.min(120*dt,genE.x-cx-30);}
  else if(phase==='duel'){genA.x+=(cx-genA.x)*Math.min(1,6*dt);genE.alive=false;}
  else if(phase==='route'){genA.x+=(cx+W*0.12-genA.x)*Math.min(1,3*dt);}}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0e1116');g.addColorStop(.62,'#141a22');g.addColorStop(1,'#1c2530');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const mg=ctx.createLinearGradient(W/2-60,0,W/2+60,0);
  mg.addColorStop(0,'rgba(95,176,255,0)');mg.addColorStop(.5,'rgba(180,200,230,.06)');mg.addColorStop(1,'rgba(255,107,107,0)');
  ctx.fillStyle=mg;ctx.fillRect(W/2-60,0,120,H);
  for(const u of units){if(!u.alive)continue;ctx.fillStyle=u.side==='ally'?'rgba(95,176,255,.85)':'rgba(255,107,107,.82)';ctx.fillRect(u.x-2,u.y-2,4,4);}
  function gen(o,col){if(!o.alive)return;ctx.save();ctx.translate(o.x,o.y);ctx.strokeStyle=col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.stroke();ctx.fillStyle=col;ctx.fillRect(-1.5,-26,3,16);
    ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(12,-22);ctx.lineTo(0,-18);ctx.fill();ctx.restore();}
  gen(genA,'#ffd24a');gen(genE,'#ff8a5c');}
function updateHud(){let a=0,e=0;for(const u of units){if(!u.alive)continue;u.side==='ally'?a++:e++;}
  aN.textContent=a;eN.textContent=e;killEl.textContent='斩获 '+kills;}
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(phase==='duel')dt*=0.28;
  t+=dt;step(dt);draw();updateHud();
  if(phase==='charge'&&t>1.6){phase='clash';t=0;spawnLine('突遇 <span class="r">淳于琼</span> 护粮之军 ——');setTimeout(()=>spawnWord('破！'),800);}
  else if(phase==='clash'&&t>2.0){phase='duel';t=0;triggerDuel();spawnCount('斩首');}
  else if(phase==='duel'&&t>0.95){phase='route';t=0;spawnLine('河北既定，天下之势初分');}
  else if(phase==='route'&&t>2.4){phase='done';running=false;go.disabled=false;}
  if(running)requestAnimationFrame(loop);}
go.addEventListener('click',start);
</script>
</body>
</html>
